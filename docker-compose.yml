# Local development convenience — `docker compose up` to run the containerised app.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      GIT_SHA: local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
